<svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="100%" stop-color="#0F111A" />
    </linearGradient>

    <!-- Glowing Green Gradient for Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Drop Shadow for Inner Icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Ring (representing the 100% circle) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Center Tick Mark (Attendance Present) -->
  <path d="M190 260 L235 305 L335 190" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
</svg>
