name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master, flutter ]
  pull_request:
    branches: [ main, master, flutter ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Analyze & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🩺 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: 📐 Verify Code Formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 🔍 Static Code Analysis (Strict Lints)
        working-directory: flutter_app
        run: flutter analyze

      - name: 🧪 Run Automated Test Suite
        working-directory: flutter_app
        run: flutter test --coverage

      - name: 🔐 Decode Optional Firebase & Signing Secrets
        working-directory: flutter_app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          fi

      - name: 🚀 Build Android Release APK
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} 2>&1 | tee /tmp/apk_build.log || {
              grep -E '^(e: |w: |FAILURE:|What went wrong:|Execution failed|Caused by:|> )' /tmp/apk_build.log | head -n 30 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              exit 1
            }

      - name: 📦 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-attendance-tracker-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
