name: Send Attendance Reminders

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel API to send reminders
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VERCEL_APP_URL }}/api/send-notification?type=cron&key=${{ secrets.CRON_SECRET_KEY }}"
